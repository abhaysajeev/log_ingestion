# nginx/http.conf -- behind the host's own reverse proxy (NGINX_CONF=http.conf).
#
# The host proxy owns ports 80/443 and the certificate, and forwards
# logs.<domain> to this container on 127.0.0.1:${HTTP_PORT} (DEPLOYMENT.txt,
# option B). Plain HTTP here; nothing outside the host can reach it.

worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 1m;

    # The host proxy is the only client: rate-limit on the address it forwards.
    real_ip_header    X-Forwarded-For;
    set_real_ip_from  0.0.0.0/0;
    limit_req_zone $binary_remote_addr zone=ingest:10m rate=100r/s;
    # Dashboards and admin: plenty for a person (a page is 3-4 calls), far too
    # slow to guess a token -- dashboard tokens may be short, chosen by hand.
    limit_req_zone $binary_remote_addr zone=reader:10m rate=5r/s;
    limit_req_status 429;

    upstream fastapi {
        server fastapi:8000;
        keepalive 32;
    }

    server {
        listen 80 default_server;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location /ingest {
            client_max_body_size 8m;
            limit_req zone=ingest burst=200 nodelay;
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        location ~ ^/(p|admin)/ {
            limit_req zone=reader burst=30 nodelay;
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }
    }
}
