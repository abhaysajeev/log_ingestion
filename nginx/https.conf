# nginx/https.conf -- nginx owns the host's ports 80 and 443 (NGINX_CONF=https.conf).
#
# Certificate: Let's Encrypt, issued on the host by certbot's webroot mode
# (the /.well-known/acme-challenge/ location below) and copied into
# nginx/certs -- DEPLOYMENT.txt step 3. Renewal re-copies and reloads.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;

    # Dashboards and their API calls are small; ingest batches are not (up to
    # 100 logs, each with request and response bodies).
    client_max_body_size 1m;

    # Per-IP ingest rate limit -- a flood from one source cannot fill the queue.
    limit_req_zone $binary_remote_addr zone=ingest:10m rate=100r/s;
    # Dashboards and admin: plenty for a person (a page is 3-4 calls), far too
    # slow to guess a token -- dashboard tokens may be short, chosen by hand.
    limit_req_zone $binary_remote_addr zone=reader:10m rate=5r/s;
    limit_req_status 429;

    upstream fastapi {
        server fastapi:8000;
        keepalive 32;
    }

    server {
        listen 80 default_server;

        # certbot --webroot proves the domain here, for issue and renewal.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location /ingest {
            client_max_body_size 8m;
            limit_req zone=ingest burst=200 nodelay;
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        location ~ ^/(p|admin)/ {
            limit_req zone=reader burst=30 nodelay;
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # Health, and anything else.
        location / {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }
    }
}
