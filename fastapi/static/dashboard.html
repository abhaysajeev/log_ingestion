<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Logs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f8f9fb;
      --border: #e4e7ed; --border-2: #d0d5de;
      --text-1: #111827; --text-2: #4b5563; --text-3: #9ca3af;
      --accent: #2563eb; --accent-bg: #eff6ff; --accent-h: #1d4ed8;
      --success: #16a34a; --warning: #b45309; --error: #dc2626; --info: #0369a1;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,.09); --shadow-lg: 0 12px 40px rgba(0,0,0,.13);
      --r: 8px; --r-sm: 6px; --tr: .15s ease;
      --mono: 'SF Mono','Fira Code','Consolas',monospace;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text-1); min-height: 100vh; line-height: 1.5; font-size: 13px; }

    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); height: 52px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; box-shadow: var(--shadow-sm); }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-logo { width: 30px; height: 30px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-sub { font-size: 12px; color: var(--text-3); white-space: nowrap; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .live { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); cursor: pointer; user-select: none; }
    .live input { accent-color: var(--accent); }

    .filters { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .f { display: flex; flex-direction: column; gap: 4px; }
    .f label { font-size: 10.5px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; }
    .f input, .f select { height: 34px; padding: 0 10px; width: 170px; border: 1.5px solid var(--border); border-radius: var(--r-sm); background: var(--surface); font: inherit; font-size: 13px; color: var(--text-1); outline: none; transition: border-color var(--tr), box-shadow var(--tr); }
    .f.wide input { width: 290px; font-family: var(--mono); font-size: 12px; }
    .f input[type=date] { width: 150px; }
    .f input:focus, .f select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .f input::placeholder { color: var(--text-3); }
    .f-actions { display: flex; gap: 8px; margin-left: auto; }

    .btn { height: 34px; padding: 0 14px; border: none; border-radius: var(--r-sm); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: all var(--tr); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-ghost { background: transparent; color: var(--text-2); border: 1.5px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .bar { padding: 10px 24px 0; display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--text-2); }
    .bar strong { color: var(--text-1); }
    .error-note { color: var(--error); }

    .table-wrap { padding: 10px 24px 16px; overflow-x: auto; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-sm); overflow: hidden; }
    th { background: var(--surface-2); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 10px 14px; font-size: 13px; color: var(--text-2); border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
    tbody tr { cursor: pointer; transition: background var(--tr); }
    tbody tr:hover { background: var(--accent-bg); }
    tbody tr:last-child td { border-bottom: none; }
    .t-time { font-variant-numeric: tabular-nums; font-size: 12.5px; }
    .t-mono { font-family: var(--mono); font-size: 12px; }
    .method { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--text-3); margin-right: 6px; }
    .t-path { font-family: var(--mono); font-size: 12px; color: var(--text-1); }
    .t-dim { color: var(--text-3); }
    .t-slow { color: var(--warning); font-weight: 600; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 4px; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .s2 { background: #dcfce7; color: var(--success); } .s3 { background: #e0f2fe; color: var(--info); }
    .s4 { background: #fef3c7; color: var(--warning); } .s5 { background: #fee2e2; color: var(--error); }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 100px; font-size: 11.5px; background: #ede9fe; color: #5b21b6; }
    .empty { text-align: center; padding: 60px 20px !important; color: var(--text-3); white-space: normal; }

    .pager { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 24px 28px; }
    .pager span { font-size: 12.5px; color: var(--text-2); min-width: 120px; text-align: center; }

    .veil { position: fixed; inset: 0; background: rgba(17,24,39,.3); z-index: 400; display: none; }
    .veil.show { display: block; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--surface); box-shadow: var(--shadow-lg); z-index: 401; display: none; flex-direction: column; }
    .drawer.show { display: flex; }
    .drawer-head { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .drawer-head h2 { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drawer-body { padding: 18px 20px 28px; overflow-y: auto; }
    .sec { margin-bottom: 18px; }
    .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .sec-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-3); }
    .copy { font-size: 11.5px; color: var(--accent); background: none; border: none; cursor: pointer; font: inherit; font-size: 11.5px; }
    .json { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.65; color: var(--text-2); white-space: pre-wrap; word-break: break-word; max-height: 460px; overflow: auto; }
    .jk { color: #6d28d9; } .js { color: #059669; } .jn { color: #d97706; } .jb { color: #db2777; } .jz { color: #94a3b8; font-style: italic; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .cell { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 8px 11px; min-width: 0; }
    .cell .k { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); }
    .cell .v { font-size: 12.5px; color: var(--text-1); word-break: break-all; }

    .gate { position: fixed; inset: 0; background: rgba(17,24,39,.5); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 900; }
    .gate.show { display: flex; }
    .gate-box { background: var(--surface); border-radius: 14px; padding: 28px; width: 360px; box-shadow: var(--shadow-lg); }
    .gate-box h2 { font-size: 16px; margin-bottom: 4px; } .gate-box p { color: var(--text-2); margin-bottom: 16px; }
    .gate-box input { width: 100%; height: 40px; padding: 0 12px; border: 1.5px solid var(--border); border-radius: var(--r-sm); font: inherit; margin-bottom: 10px; outline: none; }
    .gate-box input:focus { border-color: var(--accent); }
    .gate-error { color: var(--error); font-size: 12px; margin-bottom: 8px; display: none; }

    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--text-1); color: #fff; padding: 9px 14px; border-radius: var(--r-sm); font-size: 12.5px; opacity: 0; transform: translateY(8px); transition: all .2s ease; z-index: 999; pointer-events: none; }
    .toast.show { opacity: 1; transform: none; }

    @media (max-width: 760px) {
      .topbar, .filters, .bar, .table-wrap, .pager { padding-left: 14px; padding-right: 14px; }
      .f, .f input, .f select, .f.wide input { width: 100%; }
      .f-actions { margin-left: 0; width: 100%; }
      .brand-sub { display: none; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div>
    <div class="brand-name" id="projectName">Logs</div>
    <div class="brand-sub" id="profileTitle"></div>
  </div>
  <div class="topbar-right">
    <label class="live" title="Reload the first page every 10 seconds"><input type="checkbox" id="live"> Live</label>
    <button class="btn btn-ghost" id="exportBtn" type="button">Export</button>
  </div>
</header>

<form class="filters" id="filters" autocomplete="off">
  <div class="f"><label for="f-from">From</label><input type="date" id="f-from" name="from"></div>
  <div class="f"><label for="f-to">To</label><input type="date" id="f-to" name="to"></div>
  <div class="f-actions">
    <button class="btn btn-ghost" type="button" id="clearBtn">Clear</button>
    <button class="btn btn-primary" type="submit">Search</button>
  </div>
</form>

<div class="bar"><div id="summary">&nbsp;</div><div id="retention" class="t-dim"></div></div>
<div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pager">
  <button class="btn btn-ghost" id="prev" type="button">&larr; Newer</button>
  <span id="pageInfo"></span>
  <button class="btn btn-ghost" id="next" type="button">Older &rarr;</button>
</div>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" aria-label="Log detail">
  <div class="drawer-head"><h2 id="drawerTitle">Log</h2><button class="btn btn-ghost" id="closeDrawer" type="button">Close</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="gate" id="gate">
  <form class="gate-box" id="gateForm">
    <h2>Dashboard access</h2>
    <p>Open the link you were given, or paste the project's token.</p>
    <input type="password" id="gateToken" placeholder="Dashboard token" autocomplete="off">
    <div class="gate-error" id="gateError">That token does not open this project.</div>
    <button class="btn btn-primary" type="submit">Open</button>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // /p/<slug>/ -- the project comes from the address, its token from the link's
  // #token=... part (never sent to the server, never in a log), kept for this
  // browser tab only.
  var slug = decodeURIComponent(location.pathname.split('/')[2] || '');
  var API = '/p/' + encodeURIComponent(slug) + '/api/';
  var TOKEN_KEY = 'logs-token:' + slug;
  var PER_PAGE = 50;
  var meta = null, page = 1, total = null, liveTimer = null;

  var hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('token')) {
    try { sessionStorage.setItem(TOKEN_KEY, hash.get('token')); } catch (e) {}
    history.replaceState(null, '', location.pathname + location.search);
  }
  function token() { try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);   // text only: log data is never HTML
    return node;
  }
  function toast(message) {
    var t = $('toast'); t.textContent = message; t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function get(obj, path) {
    return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, obj);
  }

  function call(path, params) {
    var url = API + path + (params ? '?' + params.toString() : '');
    return fetch(url, { headers: { 'X-Dashboard-Token': token() } }).then(function (r) {
      if (r.status === 401) { showGate(true); throw new Error('token'); }
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (b) {
        throw new Error(typeof b.detail === 'string' ? b.detail : 'The server said ' + r.status);
      });
      return r.json();
    });
  }

  function showGate(wrong) {
    $('gate').classList.add('show');
    $('gateError').style.display = wrong && token() ? 'block' : 'none';
    $('gateToken').focus();
  }
  $('gateForm').addEventListener('submit', function (e) {
    e.preventDefault();
    try { sessionStorage.setItem(TOKEN_KEY, $('gateToken').value.trim()); } catch (err) {}
    $('gate').classList.remove('show');
    start();
  });

  // ── filters, drawn from the profile ─────────────────────────────────────
  function buildFilters() {
    var form = $('filters'), actions = form.querySelector('.f-actions');
    meta.profile.filters.forEach(function (spec) {
      var box = el('div', 'f' + (spec.wide ? ' wide' : ''));
      var id = 'f-' + spec.key;
      var label = el('label', null, spec.label); label.htmlFor = id; box.appendChild(label);
      var input;
      if (spec.options) {
        input = el('select');
        input.appendChild(new Option('All', ''));
        spec.options.forEach(function (o) { input.appendChild(new Option(o, o)); });
      } else {
        input = el('input'); input.type = spec.kind === 'min_number' ? 'number' : 'text';
        input.placeholder = spec.placeholder || '';
        if (spec.kind === 'min_number') input.min = '0';
        if (spec.suggest) attachSuggestions(input, spec.key, box);
      }
      input.id = id; input.name = spec.key; box.appendChild(input);
      form.insertBefore(box, actions);
    });
    // The address bar holds the filters: a filtered view can be bookmarked or sent.
    var here = new URLSearchParams(location.search);
    Array.prototype.forEach.call(form.elements, function (f) {
      if (f.name && here.has(f.name)) f.value = here.get(f.name);
    });
    page = Math.max(1, parseInt(here.get('page') || '1', 10) || 1);
  }

  function attachSuggestions(input, key, box) {
    var list = el('datalist'); list.id = 'dl-' + key; box.appendChild(list);
    input.setAttribute('list', list.id);
    var timer = null, asked = null;
    function ask() {
      var prefix = input.value.trim();
      if (asked === prefix) return;
      asked = prefix;
      call('suggest', new URLSearchParams({ filter: key, prefix: prefix })).then(function (b) {
        list.textContent = '';
        b.values.forEach(function (v) { list.appendChild(new Option(v)); });
      }).catch(function () {});
    }
    input.addEventListener('focus', ask);
    input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(ask, 250); });
  }

  function filterParams() {
    var params = new URLSearchParams();
    Array.prototype.forEach.call($('filters').elements, function (f) {
      if (f.name && f.value.trim()) params.set(f.name, f.value.trim());
    });
    return params;
  }

  // ── cells ────────────────────────────────────────────────────────────────
  function fmtTime(value) {
    if (!value) return '';
    var d = new Date(value);
    if (isNaN(d)) return String(value);
    return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short' }) + ' ' +
           d.toLocaleTimeString(undefined, { hour12: false });
  }
  function cell(doc, col) {
    var td = el('td'), value = get(doc, col.path);
    switch (col.format) {
      case 'time': td.className = 't-time'; td.textContent = fmtTime(value || doc.received_at); break;
      case 'tag': if (value) td.appendChild(el('span', 'tag', value)); break;
      case 'request':
        td.appendChild(el('span', 'method', get(doc, col.method) || ''));
        td.appendChild(el('span', 't-path', value || ''));
        td.title = value || ''; break;
      case 'status':
        if (value != null) td.appendChild(el('span', 'badge s' + String(value).charAt(0), value)); break;
      case 'code': td.className = 't-mono'; td.textContent = value || ''; break;
      case 'ms':
        if (value != null) { td.textContent = value + ' ms'; if (value >= 1000) td.className = 't-slow'; } break;
      case 'device':
        if (value != null && value !== '') td.textContent = '#' + value;
        else { td.className = 't-mono t-dim'; td.textContent = get(doc, col.fallback) || ''; } break;
      case 'summary': td.className = 't-mono'; td.textContent = value ? JSON.stringify(value).slice(0, 140) : ''; break;
      default: td.textContent = value == null ? '' : value;
    }
    return td;
  }

  // ── the list ─────────────────────────────────────────────────────────────
  function load() {
    var params = filterParams();
    var shown = new URLSearchParams(params); if (page > 1) shown.set('page', page);
    history.replaceState(null, '', location.pathname + (shown.toString() ? '?' + shown : ''));
    params.set('page', page); params.set('per_page', PER_PAGE);
    $('summary').textContent = 'Loading…';
    return call('logs', params).then(function (b) {
      total = b.total;
      render(b.items);
      var from = (b.page - 1) * b.per_page;
      $('summary').textContent = '';
      if (!b.items.length) { $('summary').textContent = 'No logs match.'; }
      else {
        $('summary').append('Showing ', el('strong', null, (from + 1) + '–' + (from + b.items.length)),
          ' of ', el('strong', null, total == null ? 'many' : total.toLocaleString()));
      }
      var pages = total == null ? null : Math.max(1, Math.ceil(total / PER_PAGE));
      $('pageInfo').textContent = 'Page ' + b.page + (pages ? ' of ' + pages.toLocaleString() : '');
      $('prev').disabled = b.page <= 1;
      $('next').disabled = b.items.length < PER_PAGE || (pages !== null && b.page >= pages);
    }).catch(function (err) {
      if (err.message !== 'token') { $('summary').textContent = ''; $('summary').append(el('span', 'error-note', err.message)); }
    });
  }

  function render(items) {
    var body = $('rows'); body.textContent = '';
    if (!items.length) {
      var tr = el('tr'), td = el('td', 'empty', 'Nothing here for these filters.');
      td.colSpan = meta.profile.columns.length; tr.appendChild(td); body.appendChild(tr); return;
    }
    items.forEach(function (doc) {
      var tr = el('tr');
      meta.profile.columns.forEach(function (col) { tr.appendChild(cell(doc, col)); });
      tr.addEventListener('click', function () { openLog(doc.id); });
      body.appendChild(tr);
    });
  }

  // ── one log ──────────────────────────────────────────────────────────────
  function jsonNode(value) {
    // Pretty JSON, coloured by building spans -- never by writing HTML strings.
    var pre = el('div', 'json');
    var text = JSON.stringify(value, null, 2);
    if (text === undefined) text = String(value);
    var re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;
    var last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) pre.appendChild(document.createTextNode(text.slice(last, m.index)));
      var cls = m[1] ? (m[2] ? 'jk' : 'js') : m[3] ? 'jb' : m[0] === 'null' ? 'jz' : 'jn';
      pre.appendChild(el('span', cls, m[1] ? m[1] : m[0]));
      if (m[2]) pre.appendChild(document.createTextNode(m[2]));
      last = re.lastIndex;
    }
    pre.appendChild(document.createTextNode(text.slice(last)));
    return pre;
  }
  function section(label, content, copyText) {
    var sec = el('div', 'sec'), head = el('div', 'sec-head');
    head.appendChild(el('div', 'sec-label', label));
    if (copyText !== undefined) {
      var b = el('button', 'copy', 'Copy'); b.type = 'button';
      b.addEventListener('click', function () {
        navigator.clipboard.writeText(copyText).then(function () { toast('Copied'); });
      });
      head.appendChild(b);
    }
    sec.appendChild(head); sec.appendChild(content); return sec;
  }
  function openLog(id) {
    call('logs/' + encodeURIComponent(id)).then(function (doc) {
      var body = $('drawerBody'); body.textContent = '';
      var l = doc.log || {};
      $('drawerTitle').textContent = l.path ? (l.method || '') + ' ' + l.path + (l.status ? ' · ' + l.status : '') : 'Log';
      meta.profile.detail.forEach(function (d) {
        var value = get(doc, d.path);
        if (d.format === 'fields') {
          var grid = el('div', 'grid');
          var shown = Object.assign({ received: doc.received_at, device_id: doc.device_id }, value || {});
          (d.omit || []).forEach(function (k) { delete shown[k]; });
          Object.keys(shown).forEach(function (k) {
            var v = shown[k]; if (v === null || v === '' || v === undefined) return;
            var c = el('div', 'cell');
            c.appendChild(el('div', 'k', k.replace(/_/g, ' ')));
            c.appendChild(el('div', 'v', typeof v === 'object' ? JSON.stringify(v) : v));
            grid.appendChild(c);
          });
          body.appendChild(section(d.label, grid));
        } else {
          var empty = value === undefined || value === null || (typeof value === 'object' && !Object.keys(value).length);
          body.appendChild(section(d.label, empty ? el('div', 't-dim', 'Nothing sent.') : jsonNode(value),
                                   empty ? undefined : JSON.stringify(value, null, 2)));
        }
      });
      $('veil').classList.add('show'); $('drawer').classList.add('show');
    }).catch(function (err) { if (err.message !== 'token') toast(err.message); });
  }
  function closeDrawer() { $('veil').classList.remove('show'); $('drawer').classList.remove('show'); }
  $('veil').addEventListener('click', closeDrawer);
  $('closeDrawer').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

  // ── wiring ───────────────────────────────────────────────────────────────
  $('filters').addEventListener('submit', function (e) { e.preventDefault(); page = 1; load(); });
  $('clearBtn').addEventListener('click', function () { $('filters').reset(); page = 1; load(); });
  $('prev').addEventListener('click', function () { if (page > 1) { page--; load(); } });
  $('next').addEventListener('click', function () { page++; load(); });
  $('live').addEventListener('change', function () {
    clearInterval(liveTimer);
    if (this.checked) { page = 1; load(); liveTimer = setInterval(function () { if (page === 1) load(); }, 10000); }
  });
  $('exportBtn').addEventListener('click', function () {
    var btn = this; btn.disabled = true; btn.textContent = 'Exporting…';
    fetch(API + 'export?' + filterParams(), { headers: { 'X-Dashboard-Token': token() } })
      .then(function (r) { if (!r.ok) throw new Error('Export failed (' + r.status + ')'); return r.blob(); })
      .then(function (blob) {
        var a = el('a'); a.href = URL.createObjectURL(blob);
        a.download = slug + '-logs-' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '') + '.json';
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
      })
      .catch(function (err) { toast(err.message); })
      .then(function () { btn.disabled = false; btn.textContent = 'Export'; });
  });

  function start() {
    if (!token()) { showGate(false); return; }
    call('meta').then(function (m) {
      meta = m;
      document.title = m.project.name + ' · ' + m.profile.title;
      $('projectName').textContent = m.project.name;
      $('profileTitle').textContent = m.profile.title;
      $('retention').textContent = m.retention_days > 0 ? 'Kept for ' + m.retention_days + ' days' : '';
      var head = $('head'); head.textContent = '';
      m.profile.columns.forEach(function (c) { head.appendChild(el('th', null, c.label)); });
      if (!$('filters').querySelector('[name="' + (m.profile.filters[0] || {}).key + '"]')) buildFilters();
      load();
    }).catch(function (err) { if (err.message !== 'token') $('summary').textContent = err.message; });
  }
  start();
})();
</script>
</body>
</html>
