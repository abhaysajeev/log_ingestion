# Log ingestion platform. Ports are published by one of the two override files,
# chosen with COMPOSE_FILE in .env (DEPLOYMENT.txt step 4):
#   docker-compose.yml:docker-compose.https.yml   nginx owns 80/443 + certificate
#   docker-compose.yml:docker-compose.proxied.yml  behind the host's reverse proxy

services:

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_healthy
    mem_limit: 80m
    memswap_limit: 80m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  fastapi:
    build: ./fastapi
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/logsdb?authSource=admin
      - PROJECTS_FILE=/app/config/projects.json
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-45}
      - RATE_LIMIT_PER_PROJECT=${RATE_LIMIT_PER_PROJECT:-60000}
      - QUEUE_BACKPRESSURE_LIMIT=${QUEUE_BACKPRESSURE_LIMIT:-10000}
      - STREAM_MAXLEN=${STREAM_MAXLEN:-15000}
      - REDIS_MEMORY_LIMIT=${REDIS_MEMORY_LIMIT:-0.8}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    volumes:
      # Per-project keys and tokens (scripts/add_project.py); restart fastapi
      # after changing it.
      - ./config/projects.json:/app/config/projects.json:ro
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    mem_limit: 400m
    memswap_limit: 400m
    healthcheck:
      # /livez: the process answers. /health (Redis, MongoDB, workers) is for
      # the uptime monitor -- it may be 503 while they recover, and nginx
      # must still start.
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    volumes:
      - redis_data:/data
    # 2.5x maxmemory: an AOF rewrite forks, and the copy-on-write pages plus
    # buffers must not push the container into an OOM kill.
    mem_limit: 320m
    memswap_limit: 320m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./worker
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/logsdb?authSource=admin
      - WORKER_BATCH_SIZE=500
      - WORKER_FLUSH_INTERVAL_SECONDS=5
      - WORKER_MAX_RETRIES=3
      - MAIN_STREAM=logs_stream
      - CONSUMER_GROUP=workers
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_DLQ_THRESHOLD=${ALERT_DLQ_THRESHOLD:-10}
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    # A full batch is up to 500 logs (each up to 8 MB in theory): 100m was an
    # OOM kill waiting for one large batch.
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      # The loop touches /tmp/heartbeat every 10 s, even while it waits for
      # MongoDB; an older file means the loop is stuck.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 60"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  mongodb:
    image: mongo:7
    restart: unless-stopped
    # No published port: only the services above reach it. For a one-off
    # shell:  sudo docker compose exec mongodb mongosh -u admin -p
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: logsdb
    command: >
      mongod
      --wiredTigerCacheSizeGB 0.5
      --auth
    volumes:
      - mongo_data:/data/db
    # WiredTiger's cache (0.5 GB) plus connections, index builds and sorts.
    mem_limit: 1200m
    memswap_limit: 1200m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # Nightly compressed dump into ./backups, the newest BACKUP_RETAIN_DAYS kept.
  # The mongo image ships mongodump (the old Python/FastAPI-image backup had
  # neither the script nor mongodump inside it and never produced a file).
  backup:
    image: mongo:7
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/logs-$$(date -u +%Y-%m-%d).archive.gz
          if [ ! -s "$$file" ]; then
            mongodump --uri "$$MONGODB_URL" --gzip --archive="$$file.part" && mv "$$file.part" "$$file" \
              && echo "backup: $$file $$(du -h "$$file" | cut -f1)" || { rm -f "$$file.part"; echo "backup FAILED"; }
          fi
          find /backups -name 'logs-*.archive.gz' -mtime +"$$BACKUP_RETAIN_DAYS" -delete
          sleep 86400
        done
    environment:
      - MONGODB_URL=mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/logsdb?authSource=admin
      - BACKUP_RETAIN_DAYS=${BACKUP_RETAIN_DAYS:-7}
    volumes:
      - ./backups:/backups
    depends_on:
      mongodb:
        condition: service_healthy
    mem_limit: 300m
    memswap_limit: 300m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  redis_data:
  mongo_data:
