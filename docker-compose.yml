# Log ingestion platform. Ports are published by one of the two override files,
# chosen with COMPOSE_FILE in .env (DEPLOYMENT.txt step 4):
#   docker-compose.yml:docker-compose.https.yml   nginx owns 80/443 + certificate
#   docker-compose.yml:docker-compose.proxied.yml  behind the host's reverse proxy

services:

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_healthy
    mem_limit: 80m
    memswap_limit: 80m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  fastapi:
    build: ./fastapi
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/logsdb?authSource=admin
      - PROJECTS_FILE=/app/config/projects.json
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-45}
      - RATE_LIMIT_PER_PROJECT=${RATE_LIMIT_PER_PROJECT:-60000}
      - QUEUE_BACKPRESSURE_LIMIT=${QUEUE_BACKPRESSURE_LIMIT:-50000}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    volumes:
      # Per-project keys and tokens (scripts/add_project.py); restart fastapi
      # after changing it.
      - ./config/projects.json:/app/config/projects.json:ro
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    mem_limit: 400m
    memswap_limit: 400m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    mem_limit: 200m
    memswap_limit: 200m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./worker
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/logsdb?authSource=admin
      - WORKER_BATCH_SIZE=500
      - WORKER_FLUSH_INTERVAL_SECONDS=5
      - WORKER_MAX_RETRIES=3
      - DLQ_STREAM=logs_dlq
      - MAIN_STREAM=logs_stream
      - CONSUMER_GROUP=workers
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_DLQ_THRESHOLD=${ALERT_DLQ_THRESHOLD:-10}
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    mem_limit: 100m
    memswap_limit: 100m

  mongodb:
    image: mongo:7
    restart: unless-stopped
    # No published port: only the services above reach it. For a one-off
    # shell:  sudo docker compose exec mongodb mongosh -u admin -p
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: logsdb
    command: >
      mongod
      --wiredTigerCacheSizeGB 1
      --auth
    volumes:
      - mongo_data:/data/db
    mem_limit: 1200m
    memswap_limit: 1200m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Nightly compressed dump into ./backups, the newest BACKUP_RETAIN_DAYS kept.
  # The mongo image ships mongodump (the old Python/FastAPI-image backup had
  # neither the script nor mongodump inside it and never produced a file).
  backup:
    image: mongo:7
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/logs-$$(date -u +%Y-%m-%d).archive.gz
          if [ ! -s "$$file" ]; then
            mongodump --uri "$$MONGODB_URL" --gzip --archive="$$file.part" && mv "$$file.part" "$$file" \
              && echo "backup: $$file $$(du -h "$$file" | cut -f1)" || { rm -f "$$file.part"; echo "backup FAILED"; }
          fi
          find /backups -name 'logs-*.archive.gz' -mtime +"$$BACKUP_RETAIN_DAYS" -delete
          sleep 86400
        done
    environment:
      - MONGODB_URL=mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/logsdb?authSource=admin
      - BACKUP_RETAIN_DAYS=${BACKUP_RETAIN_DAYS:-7}
    volumes:
      - ./backups:/backups
    depends_on:
      mongodb:
        condition: service_healthy
    mem_limit: 300m
    memswap_limit: 300m

volumes:
  redis_data:
  mongo_data:
